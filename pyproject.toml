[project]
name = "hunterbot"
version = "0.1.0"
description = "Buscador universal de oportunidades: inmuebles, productos, barcos y más"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "duckduckgo-search>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
hunterbot = "hunterbot.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
